<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>manaba Customizer</title>
        <link
            rel="stylesheet"
            href="popup.css"
        />
    </head>
    <body>
        <div class="popup-container">
            <!-- ヘッダーエリア: タイトルとマスター有効化スイッチ -->
            <header class="header">
                <div class="brand-text">
                    <h1 class="brand-title">manaba Customizer</h1>
                </div>
                <label
                    class="square-switch"
                    data-tooltip="拡張機能全体の有効 / 無効を切り替えます"
                >
                    <input
                        type="checkbox"
                        id="enabled"
                    />
                    <span class="square-slider"></span>
                </label>
            </header>

            <!-- メイン設定リスト -->
            <main
                class="main-content"
                id="settingsForm"
            >
                <!-- テーマモード選択セグメントコントロール -->
                <div class="theme-segmented-control">
                    <label class="segment-label" data-tooltip="システム（OS）の配色設定に自動連動します">
                        <input
                            type="radio"
                            name="themeMode"
                            value="system"
                            id="themeSystem"
                        />
                        <span class="segment-btn">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    width="20"
                                    height="14"
                                    x="2"
                                    y="3"
                                />
                                <line
                                    x1="8"
                                    x2="16"
                                    y1="21"
                                    y2="21"
                                />
                                <line
                                    x1="12"
                                    x2="12"
                                    y1="17"
                                    y2="21"
                                    stroke-linecap="round"
                                />
                            </svg>
                            自動
                        </span>
                    </label>
                    <label class="segment-label" data-tooltip="常にライトモードで表示します">
                        <input
                            type="radio"
                            name="themeMode"
                            value="light"
                            id="themeLight"
                        />
                        <span class="segment-btn">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="4"
                                />
                                <path
                                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
                                />
                            </svg>
                            ライト
                        </span>
                    </label>
                    <label class="segment-label" data-tooltip="常にダークモードで表示します">
                        <input
                            type="radio"
                            name="themeMode"
                            value="dark"
                            id="themeDark"
                        />
                        <span class="segment-btn">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
                            </svg>
                            ダーク
                        </span>
                    </label>
                </div>

                <!-- 設定項目リスト -->
                <div class="settings-list">

                    <!-- manaba自動ログイン -->
                    <div class="setting-item" data-tooltip="認証画面 (gakunin-idp) でログインボタンを1秒後に自動クリックします">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                                    <polyline points="10 17 15 12 10 7" />
                                    <line
                                        x1="15"
                                        x2="3"
                                        y1="12"
                                        y2="12"
                                    />
                                </svg>
                            </div>
                            <span class="setting-name">manaba自動ログイン</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="autoLogin"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>

                    <!-- 回答フォーム外観調整 -->
                    <div class="setting-item" data-tooltip="小テストやレポート等の入力欄 (textarea) やフォームを見やすく拡大・整形します">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <rect
                                        width="18"
                                        height="18"
                                        x="3"
                                        y="3"
                                    />
                                    <line
                                        x1="7"
                                        x2="17"
                                        y1="8"
                                        y2="8"
                                    />
                                    <line
                                        x1="7"
                                        x2="17"
                                        y1="12"
                                        y2="12"
                                    />
                                    <line
                                        x1="7"
                                        x2="13"
                                        y1="16"
                                        y2="16"
                                    />
                                </svg>
                            </div>
                            <span class="setting-name">回答フォーム外観調整</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="enhanceForms"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>

                    <!-- 誤答選択問題の強調表示 -->
                    <div class="setting-item" data-tooltip="テスト等の問題文中の否定語句（「誤っている」「間違い」等）を黄色で目立たせます">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="m9 11-6 6v3h3l6-6" />
                                    <path d="m22 2-7 7 4 4 7-7z" />
                                </svg>
                            </div>
                            <span class="setting-name">誤答選択問題の強調表示</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="highlightNegativeWords"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>

                    <!-- 任意文字列の置換 -->
                    <div class="setting-item" data-tooltip="設定した置換ルールに従い、本名や学籍番号等のテキストを一括置換します">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M4 7h16" />
                                    <path d="M4 12h10" />
                                    <path d="M4 17h16" />
                                    <path d="m18 10 3 2-3 2" />
                                </svg>
                            </div>
                            <span class="setting-name">任意文字列の置換</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="enableReplacements"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>

                    <!-- わかりやすいタブタイトル -->
                    <div class="setting-item" data-tooltip="閲覧中のコース名やシラバスに応じてブラウザのタブタイトルを分かりやすく変更します">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                    <line
                                        x1="4"
                                        x2="20"
                                        y1="9"
                                        y2="9"
                                    />
                                    <circle
                                        cx="7"
                                        cy="6.5"
                                        r="0.5"
                                    />
                                </svg>
                            </div>
                            <span class="setting-name">わかりやすいタブタイトル</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="renameTabTitle"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>

                    <!-- 時間割の土曜日非表示 -->
                    <div class="setting-item" data-tooltip="マイページの週間時間割から土曜日列を非表示にして平日を見やすく拡大します">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <rect
                                        width="18"
                                        height="18"
                                        x="3"
                                        y="4"
                                    />
                                    <line
                                        x1="16"
                                        x2="16"
                                        y1="2"
                                        y2="6"
                                    />
                                    <line
                                        x1="8"
                                        x2="8"
                                        y1="2"
                                        y2="6"
                                    />
                                    <line
                                        x1="3"
                                        x2="21"
                                        y1="10"
                                        y2="10"
                                    />
                                    <line
                                        x1="16"
                                        x2="16"
                                        y1="10"
                                        y2="22"
                                    />
                                </svg>
                            </div>
                            <span class="setting-name">時間割の土曜日非表示</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="removeSaturday"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>

                    <!-- 科目名カスタム表示 -->
                    <div class="setting-item" data-tooltip="登録された科目名やゼミ名をページ上でカスタム表示します">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M12 20h9" />
                                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                                </svg>
                            </div>
                            <span class="setting-name">科目名のカスタム表示</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="enableSubjectTitles"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>

                    <!-- シラバス検索リンクの追加 -->
                    <div class="setting-item" data-tooltip="コースヘッダーの講義名末尾に、講義名・教員名で直接検索できるシラバスリンクを追加します">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" />
                                    <path d="M6 6h10" />
                                    <path d="M6 10h10" />
                                </svg>
                            </div>
                            <span class="setting-name">シラバス検索リンクの追加</span>
                        </div>
                        <label class="square-switch square-switch-sm">
                            <input
                                type="checkbox"
                                id="addSyllabusLink"
                            />
                            <span class="square-slider"></span>
                        </label>
                    </div>
                </div>

                <!-- 科目名編集クイック実行ボタン -->
                <div class="action-card">
                    <button
                        type="button"
                        id="startEditSubjectBtn"
                        class="square-btn square-btn-accent action-btn"
                        data-tooltip="ページ上の科目名を直接クリックして表示名を自由に変更・登録します"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M12 20h9" />
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                        </svg>
                        <span>画面上の科目名をクリックして編集</span>
                    </button>
                    <div
                        id="editStatusMsg"
                        class="action-msg"
                        hidden
                    ></div>
                </div>

                <!-- カスタムCSS入力 (アコーディオン) -->
                <details class="details-section" data-tooltip="manabaページに適用する独自のCSSスタイルを記述します">
                    <summary class="details-summary">
                        <div class="summary-left">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polyline points="16 18 22 12 16 6" />
                                <polyline points="8 6 2 12 8 18" />
                            </svg>
                            <span>カスタムCSS</span>
                        </div>
                        <span class="summary-chevron">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polyline points="6 9 12 15 18 9" />
                            </svg>
                        </span>
                    </summary>
                    <div class="details-content">
                        <textarea
                            id="customCss"
                            class="css-textarea"
                            placeholder="/* manabaに適用する独自のCSS */&#10;body { ... }"
                            rows="4"
                        ></textarea>
                    </div>
                </details>
            </main>

            <!-- フッターエリア: リセットボタンと詳細設定ボタン -->
            <footer class="footer">
                <button
                    type="button"
                    id="resetBtn"
                    class="square-btn square-btn-secondary"
                    data-tooltip="すべての設定を初期デフォルト値に戻します"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                    <span>リセット</span>
                </button>
                <button
                    type="button"
                    id="openOptionsBtn"
                    class="square-btn square-btn-primary"
                    data-tooltip="詳細設定ページを開き、置換ルールや設定バックアップを管理します"
                >
                    <span>詳細設定</span>
                </button>
            </footer>
        </div>

        <!-- フローティングツールチップ -->
        <div
            id="customTooltip"
            class="custom-tooltip"
            role="tooltip"
            aria-hidden="true"
        ></div>

        <script
            type="module"
            src="popup.js"
        ></script>
    </body>
</html>
